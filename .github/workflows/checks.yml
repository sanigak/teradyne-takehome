name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-lock.txt && python -m pip install -e . --no-deps
      - name: Backend and all Office formats
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and production build
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: frontend
        run: npm run test:e2e

# Deterministic tests intentionally do not need an OpenRouter credential.
# Live quality evaluation is explicitly triggered in live-evaluation.yml.
