[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "teradyne-knowledge-workspace"
version = "0.1.0"
description = "Evidence-backed AI consulting knowledge workspace"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
